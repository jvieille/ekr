name: Architectural proposal
description: Propose an architectural requirement, distinction, pattern, decision question or Guidance change.
title: "[Proposal] "
labels:
  - "architectural-proposal"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to EKR. This issue enters the repository as a **Proposal**. Submission or acceptance for investigation does not make the proposal an accepted EKR position.

        If the question is still broad or exploratory, you may prefer to start in GitHub Discussions.

  - type: textarea
    id: question
    attributes:
      label: Architectural question or gap
      description: What question, gap or decision should be addressed?
      placeholder: Describe the problem as precisely as practical.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed position or change
      description: What requirement, distinction, pattern, decision question or text change do you propose?
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why this matters
      description: Explain the operational or architectural reason for the proposal.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Main area affected
      description: Choose the closest area. Select Other if the proposal spans several areas.
      options:
        - Purpose and scope discipline
        - Architecture responsibility lens
        - Authority and representation construction
        - Shared EKR representation foundation
        - Multiple viewpoints and UOD boundaries
        - Lifecycle, conformance, validation and fitness
        - Security, classification and sovereignty
        - Patterns, evidence and examples
        - Repository governance or public development process
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence, examples or alternatives
      description: Optional. Add relevant sources, experience, counterexamples, alternatives or important trade-offs.
    validations:
      required: false

  - type: input
    id: discussion
    attributes:
      label: Related Discussion
      description: Optional. If this proposal grew out of a GitHub Discussion, paste its URL here.
      placeholder: https://github.com/jvieille/ekr/discussions/...
    validations:
      required: false

  - type: checkboxes
    id: declarations
    attributes:
      label: Public contribution
      options:
        - label: I am authorised to disclose the material included in this issue publicly and understand that submission does not by itself confer EKR status.
          required: true
