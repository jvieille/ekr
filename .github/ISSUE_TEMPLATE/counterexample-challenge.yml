name: Counterexample or challenge
description: Submit a case that may falsify, overconstrain or expose ambiguity in current EKR framing or Draft Guidance.
title: "[Challenge] "
labels:
  - "challenge"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        Counterexamples and challenges are explicitly welcome. A strong challenge helps reveal ambiguity, missing conditions, excessive constraints or places where an established approach already fulfils the intended responsibility.

  - type: textarea
    id: challenged_position
    attributes:
      label: What are you challenging?
      description: Identify the Working Definition distinction, Draft Guidance section, open question or repository proposition. Link it where possible.
    validations:
      required: true

  - type: textarea
    id: counterexample
    attributes:
      label: Counterexample or case
      description: Describe the relevant operational, architectural or organisational context and what happens in the case.
    validations:
      required: true

  - type: textarea
    id: consequence
    attributes:
      label: Why it matters
      description: What ambiguity, failure mode, unnecessary constraint, missing condition or other consequence does the case expose?
    validations:
      required: true

  - type: textarea
    id: limitations
    attributes:
      label: Evidence, boundary conditions or limitations
      description: Optional. Add supporting evidence and state assumptions or reasons the case may not generalise.
    validations:
      required: false

  - type: input
    id: discussion
    attributes:
      label: Related Discussion
      description: Optional. If this challenge grew out of a GitHub Discussion, paste its URL here.
      placeholder: https://github.com/jvieille/ekr/discussions/...
    validations:
      required: false

  - type: checkboxes
    id: declarations
    attributes:
      label: Public contribution
      options:
        - label: I am authorised to disclose the material included in this issue publicly and understand that submitting a challenge does not by itself change the status of the challenged EKR material.
          required: true
