name: Reference or evidence
description: Submit a primary source, standard, paper, specification or other evidence for review and possible indexing.
title: "[Evidence] "
labels:
  - "reference-evidence"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a source is ready for structured review. For exploratory relevance questions or early source suggestions, use the **References & evidence** Discussion category first.

        Submission does not imply endorsement. Accepted sources may later be indexed in `references/` with their relevance and limitations made explicit.

  - type: input
    id: citation
    attributes:
      label: Source
      description: Give the title and author, issuing body or publisher, with version/date where relevant.
      placeholder: Organisation/author — title — version/date
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Public source link or DOI
      description: Prefer the primary or official source where one exists.
      placeholder: https://... or DOI
    validations:
      required: true

  - type: dropdown
    id: maturity
    attributes:
      label: Source maturity or status
      options:
        - Published standard or formal specification
        - Official recommendation or normative document
        - Published peer-reviewed research
        - Official technical or project documentation
        - Published implementation evidence or case material
        - Working draft, preprint or developing specification
        - Other
    validations:
      required: true

  - type: textarea
    id: relevance
    attributes:
      label: EKR topic and claimed relevance
      description: Identify the EKR claim, distinction, Guidance section, open question or architectural responsibility affected, and explain what the source supports, qualifies, challenges or clarifies.
    validations:
      required: true

  - type: textarea
    id: limitations
    attributes:
      label: Limitations or scope conditions
      description: Optional. Identify important maturity, applicability, scope or interpretation limits.
    validations:
      required: false

  - type: input
    id: discussion
    attributes:
      label: Related Discussion
      description: Optional. If this source was first explored in a GitHub Discussion, paste its URL here.
      placeholder: https://github.com/jvieille/ekr/discussions/...
    validations:
      required: false

  - type: checkboxes
    id: declarations
    attributes:
      label: Public contribution
      options:
        - label: I have linked or cited the source rather than reproducing material I am not authorised to publish, and understand that submission or indexing does not imply EKR endorsement.
          required: true
