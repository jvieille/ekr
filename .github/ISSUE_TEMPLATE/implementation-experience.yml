name: Implementation experience or case
description: Contribute practitioner experience, an implementation case, constraint or observed lesson relevant to EKR Guidance.
title: "[Experience] "
labels:
  - "implementation-experience"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        Implementation experience enters the repository as **non-normative evidence / Example material** unless it is deliberately incorporated into another governed artefact. Inclusion does not make a product, technology or architecture an EKR reference implementation.

  - type: textarea
    id: context
    attributes:
      label: Context and objective
      description: What system, organisation, domain, project or pilot is involved, and what operational or architectural objective was being pursued?
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: What was tried or observed?
      description: Describe the relevant approach and what happened in practice, including useful positive or negative observations.
    validations:
      required: true

  - type: textarea
    id: relevance
    attributes:
      label: Why is it relevant to EKR?
      description: Which EKR responsibility, Guidance section, open question or architectural distinction does this experience support, qualify or challenge?
    validations:
      required: true

  - type: textarea
    id: limitations
    attributes:
      label: Constraints, limitations or supporting material
      description: Optional. State important local assumptions, limitations, missing evidence or public references.
    validations:
      required: false

  - type: input
    id: discussion
    attributes:
      label: Related Discussion
      description: Optional. If this case grew out of a GitHub Discussion, paste its URL here.
      placeholder: https://github.com/jvieille/ekr/discussions/...
    validations:
      required: false

  - type: checkboxes
    id: declarations
    attributes:
      label: Public contribution
      options:
        - label: I am authorised to disclose the material included in this issue publicly and understand that the case remains non-normative unless deliberately incorporated through the governed process.
          required: true
